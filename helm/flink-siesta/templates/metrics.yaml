{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "siesta.fullname" . }}-metrics
  labels: { app.kubernetes.io/name: flink-siesta, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  selector: { app.kubernetes.io/name: flink-siesta, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: metrics, port: {{ .Values.metrics.service.port }}, targetPort: metrics }
{{- end }}
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "siesta.fullname" . }}
  {{- with .Values.metrics.serviceMonitor.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: flink-siesta, app.kubernetes.io/instance: {{ .Release.Name }} }
  endpoints:
    - port: metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.metrics.secure }}
      scheme: https
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig: { insecureSkipVerify: true } # the controller's certificate is self-signed
      {{- end }}
{{- end }}
{{- if and .Values.metrics.secure .Values.rbac.create }}
---
# Reviewing a scrape's token and its right to read /metrics are cluster-scoped API calls.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "siesta.fullname" . }}-{{ .Release.Namespace }}-metrics-auth
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "siesta.fullname" . }}-{{ .Release.Namespace }}-metrics-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "siesta.fullname" . }}-{{ .Release.Namespace }}-metrics-auth
subjects:
  - kind: ServiceAccount
    name: {{ include "siesta.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Bind this to the ServiceAccount your Prometheus scrapes with.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "siesta.fullname" . }}-{{ .Release.Namespace }}-metrics-reader
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
{{- end }}
