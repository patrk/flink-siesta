apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "siesta.fullname" . }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "siesta.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: flink-siesta, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flink-siesta
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "siesta.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{ toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: flink-siesta, app.kubernetes.io/instance: {{ .Release.Name }} }
      {{- end }}
      containers:
        - name: siesta
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --annotation-prefix={{ .Values.config.annotationPrefix }}
            - --dry-run={{ .Values.config.dryRun }}
            - --poll-interval={{ .Values.config.pollInterval }}
            - --probe-timeout={{ .Values.config.probeTimeout }}
            - --max-concurrent-reconciles={{ .Values.config.maxConcurrentReconciles }}
            - --kube-api-qps={{ .Values.config.kubeAPI.qps }}
            - --kube-api-burst={{ .Values.config.kubeAPI.burst }}
            - --restart-max={{ .Values.config.restart.maxRestarts }}
            - --restart-window={{ .Values.config.restart.window }}
            - --failing-after={{ .Values.config.restart.failingAfter }}
            - --restart-backoff={{ .Values.config.restart.backoff }}
            - --flink-rest={{ .Values.config.flinkRest }}
            - --leader-elect={{ gt (int .Values.replicaCount) 1 }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_SECURITY_PROTOCOL
              value: {{ .Values.kafka.securityProtocol | quote }}
            {{- $oauth := .Values.kafka.sasl.oauth }}
            {{- if eq (upper .Values.kafka.sasl.mechanism) "OAUTHBEARER" }}
            - name: KAFKA_SASL_MECHANISM
              value: OAUTHBEARER
            {{- if $oauth.serviceAccountToken.enabled }}
            - name: KAFKA_SASL_OAUTHBEARER_TOKEN_FILE
              value: /var/run/secrets/siesta/kafka-token/token
            {{- else }}
            - name: KAFKA_SASL_OAUTHBEARER_TOKEN_ENDPOINT
              value: {{ required "kafka.sasl.oauth.tokenEndpoint or serviceAccountToken.enabled is required with OAUTHBEARER" $oauth.tokenEndpoint | quote }}
            - name: KAFKA_SASL_OAUTHBEARER_CLIENT_ID
              valueFrom: { secretKeyRef: { name: {{ required "kafka.sasl.existingSecret is required with a tokenEndpoint" .Values.kafka.sasl.existingSecret }}, key: {{ $oauth.clientIdKey }} } }
            - name: KAFKA_SASL_OAUTHBEARER_CLIENT_SECRET_FILE
              value: /etc/siesta/kafka-auth/{{ $oauth.clientSecretKey }}
            {{- with $oauth.scope }}
            - name: KAFKA_SASL_OAUTHBEARER_SCOPE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with $oauth.extensions }}
            - name: KAFKA_SASL_OAUTHBEARER_EXTENSIONS
              value: {{ . | quote }}
            {{- end }}
            {{- else if .Values.kafka.sasl.existingSecret }}
            - name: KAFKA_SASL_MECHANISM
              value: {{ .Values.kafka.sasl.mechanism | quote }}
            # Mounted as files, not env: the kubelet refreshes them after a rotation, and the
            # controller reads them on every new connection, so rotation needs no restart.
            - name: KAFKA_SASL_USERNAME_FILE
              value: /etc/siesta/kafka-auth/{{ .Values.kafka.sasl.usernameKey }}
            - name: KAFKA_SASL_PASSWORD_FILE
              value: /etc/siesta/kafka-auth/{{ .Values.kafka.sasl.passwordKey }}
            {{- end }}
            {{- if .Values.kafka.tls.existingSecret }}
            - name: KAFKA_TLS_CA_FILE
              value: /etc/siesta/kafka-tls/{{ .Values.kafka.tls.caKey }}
            {{- if .Values.kafka.tls.clientCert }}
            - name: KAFKA_TLS_CERT_FILE
              value: /etc/siesta/kafka-tls/{{ .Values.kafka.tls.certKey }}
            - name: KAFKA_TLS_KEY_FILE
              value: /etc/siesta/kafka-tls/{{ .Values.kafka.tls.keyKey }}
            {{- end }}
            {{- end }}
            {{- if .Values.kafka.tls.insecureSkipVerify }}
            - name: KAFKA_TLS_INSECURE_SKIP_VERIFY
              value: "true"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          livenessProbe: { httpGet: { path: /healthz, port: health } }
          readinessProbe: { httpGet: { path: /readyz, port: health } }
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          {{- $token := and (eq (upper .Values.kafka.sasl.mechanism) "OAUTHBEARER") .Values.kafka.sasl.oauth.serviceAccountToken.enabled }}
          {{- if or .Values.kafka.tls.existingSecret .Values.kafka.sasl.existingSecret .Values.extraVolumeMounts $token }}
          volumeMounts:
            {{- if .Values.kafka.sasl.existingSecret }}
            - { name: kafka-auth, mountPath: /etc/siesta/kafka-auth, readOnly: true }
            {{- end }}
            {{- if $token }}
            - { name: kafka-token, mountPath: /var/run/secrets/siesta/kafka-token, readOnly: true }
            {{- end }}
            {{- if .Values.kafka.tls.existingSecret }}
            - { name: kafka-tls, mountPath: /etc/siesta/kafka-tls, readOnly: true }
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.kafka.tls.existingSecret .Values.kafka.sasl.existingSecret .Values.extraVolumes $token }}
      volumes:
        {{- if .Values.kafka.sasl.existingSecret }}
        - name: kafka-auth
          secret: { secretName: {{ .Values.kafka.sasl.existingSecret }} }
        {{- end }}
        {{- if $token }}
        # Rotated by the kubelet before it expires; the controller reads it on every authentication.
        - name: kafka-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ required "kafka.sasl.oauth.serviceAccountToken.audience is required" .Values.kafka.sasl.oauth.serviceAccountToken.audience | quote }}
                  expirationSeconds: {{ .Values.kafka.sasl.oauth.serviceAccountToken.expirationSeconds }}
        {{- end }}
        {{- if .Values.kafka.tls.existingSecret }}
        - name: kafka-tls
          secret: { secretName: {{ .Values.kafka.tls.existingSecret }} }
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- range .Values.extraObjects }}
---
{{ tpl (toYaml .) $ }}
{{- end }}
