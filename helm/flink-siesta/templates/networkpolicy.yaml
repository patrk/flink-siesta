{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "siesta.fullname" . }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: flink-siesta, app.kubernetes.io/instance: {{ .Release.Name }} }
  policyTypes: [Ingress{{ if .Values.networkPolicy.egress }}, Egress{{ end }}]
  ingress:
    # Health probes come from the kubelet; CNIs differ on whether node traffic needs a rule.
    - ports: [{ port: health }]
    - ports: [{ port: metrics }]
      {{- with .Values.networkPolicy.metricsFrom }}
      from: {{ toYaml . | nindent 8 }}
      {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress: {{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
