image:
  repository: ghcr.io/patrk/flink-siesta
  tag: ""
  # A digest wins over the tag when set, for registries that mandate pinning.
  digest: ""
  pullPolicy: IfNotPresent
replicaCount: 2

serviceAccount:
  # Annotations for workload identity, for example azure.workload.identity/client-id or
  # eks.amazonaws.com/role-arn.
  annotations: {}

# Flags not covered by config, for example --flink-rest-port=8082 or --resume-stall-after=20m.
extraArgs: []

config:
  annotationPrefix: siesta.flink.io
  dryRun: false
  pollInterval: 1m
  probeTimeout: 10s
  # Ask each running job's REST API (<deployment>-rest:8081) to verify the sources annotation
  # against its graph and, with the lag: job annotation, for pendingRecords. Needs egress from
  # the controller to the JobManager pods on that port.
  flinkRest: true
  restart:
    maxRestarts: 3
    window: 30m
    failingAfter: 10m
    backoff: 1m

kafka:
  bootstrapServers: ""
  securityProtocol: PLAINTEXT
  sasl:
    mechanism: PLAIN
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  tls:
    existingSecret: ""
    caKey: ca.crt
    clientCert: false
    certKey: tls.crt
    keyKey: tls.key
    insecureSkipVerify: false

metrics:
  service:
    enabled: true
    port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

rbac:
  create: true

# ValidatingAdmissionPolicy (Kubernetes 1.30+) that lets the controller change only
# spec.job.state, spec.restartNonce and its own annotations. Cluster-scoped objects; on by
# default because they cost nothing and cap what a compromised controller could do.
admissionPolicy:
  enabled: true

# Standard pod knobs.
podSecurityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 512Mi } }
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
imagePullSecrets: []
priorityClassName: ""
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
# With more than one replica the pods prefer different nodes. Set affinity to override that.
# Extra manifests, rendered through tpl, so {{ .Release.Name }} and friends work inside them.
extraObjects: []
