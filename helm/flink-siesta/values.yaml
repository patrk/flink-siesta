image:
  repository: ghcr.io/patrk/flink-siesta
  tag: ""
  # A digest wins over the tag when set, for registries that mandate pinning.
  digest: ""
  pullPolicy: IfNotPresent
replicaCount: 2

serviceAccount:
  # Annotations for workload identity, for example azure.workload.identity/client-id or
  # eks.amazonaws.com/role-arn.
  annotations: {}

# Flags not covered by config, for example --flink-rest-port=8082 or --resume-stall-after=20m.
extraArgs: []

config:
  annotationPrefix: siesta.flink.io
  dryRun: false
  pollInterval: 1m
  probeTimeout: 10s
  # Deployments reconciled at once. A tick mostly waits on Kafka and the job's REST API, so
  # one worker per hundred or so deployments keeps a pass inside pollInterval.
  maxConcurrentReconciles: 4
  # Client-side rate limit towards the Kubernetes API. A quiet tick costs one request, a
  # transition three or four.
  kubeAPI:
    qps: 20
    burst: 30
  # Ask each running job's REST API (<deployment>-rest:8081) to verify the sources annotation
  # against its graph and, with the idle: job annotation, whether the job objects to sleeping.
  # Needs egress from the controller to the JobManager pods on that port.
  flinkRest: true
  restart:
    maxRestarts: 3
    window: 30m
    failingAfter: 10m
    backoff: 1m

kafka:
  bootstrapServers: ""
  securityProtocol: PLAINTEXT
  sasl:
    # PLAIN, SCRAM-SHA-256, SCRAM-SHA-512 or OAUTHBEARER. Takes effect with a SASL_* securityProtocol.
    mechanism: PLAIN
    # PLAIN and SCRAM: a Secret with the username and password, mounted as files and read on
    # every new connection, so a rotation needs no restart. OAUTHBEARER with tokenEndpoint: the
    # Secret with the client id and secret.
    existingSecret: ""
    usernameKey: username
    passwordKey: password
    oauth:
      # Workload identity: a projected ServiceAccount token, which the kubelet rotates, for a
      # cluster that trusts this Kubernetes cluster's OIDC issuer (a Confluent Cloud identity
      # pool, Strimzi with JWKS validation). No Secret at all.
      serviceAccountToken:
        enabled: false
        audience: ""
        expirationSeconds: 3600
      # Or the client credentials grant against your identity provider, as Kafka clients do it
      # with sasl.oauthbearer.token.endpoint.url. Client id and secret come from existingSecret.
      tokenEndpoint: ""
      clientIdKey: client-id
      clientSecretKey: client-secret
      scope: ""
      # SASL extensions sent with the token, for example
      # logicalCluster=lkc-abc123,identityPoolId=pool-xyz for Confluent Cloud.
      extensions: ""
  tls:
    existingSecret: ""
    caKey: ca.crt
    clientCert: false
    certKey: tls.crt
    keyKey: tls.key
    insecureSkipVerify: false

metrics:
  # Serve metrics over HTTPS, only to callers the Kubernetes API authenticates and authorizes
  # for GET /metrics. Adds a ClusterRole for TokenReviews and SubjectAccessReviews, and one,
  # <release>-<namespace>-metrics-reader, to bind to your Prometheus' ServiceAccount.
  secure: false
  service:
    enabled: true
    port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

rbac:
  create: true

# With more than one replica, a PodDisruptionBudget keeps one running through node drains. The
# standby takes over through leader election; nothing is lost while none runs, it only waits.
podDisruptionBudget:
  enabled: true

# Optional NetworkPolicy. Off by default: the egress the controller needs (the API server,
# Kafka, the JobManagers) differs per cluster. On, it allows ingress to the metrics and health
# ports from metricsFrom and the egress listed in egress.
networkPolicy:
  enabled: false
  # Peers allowed to scrape :8080, for example a namespaceSelector for your monitoring.
  metricsFrom: []
  # Egress rules, as in a NetworkPolicy. Empty allows all egress.
  egress: []

# ValidatingAdmissionPolicy (Kubernetes 1.30+) that lets the controller change only
# spec.job.state, spec.restartNonce and its own annotations. Cluster-scoped objects; on by
# default because they cost nothing and cap what a compromised controller could do.
admissionPolicy:
  enabled: true

# Standard pod knobs.
podSecurityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 512Mi } }
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
imagePullSecrets: []
priorityClassName: ""
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
# With more than one replica the pods prefer different nodes. Set affinity to override that.
# Extra manifests, rendered through tpl, so {{ .Release.Name }} and friends work inside them.
extraObjects: []
