image:
  repository: ghcr.io/patrk/flink-siesta
  tag: ""
replicaCount: 2

config:
  annotationPrefix: siesta.flink.io
  dryRun: false
  pollInterval: 1m
  probeTimeout: 10s
  restart:
    maxRestarts: 3
    window: 30m
    failingAfter: 10m
    backoff: 1m

kafka:
  bootstrapServers: ""
  securityProtocol: PLAINTEXT
  sasl:
    mechanism: PLAIN
    existingSecret: ""
    usernameKey: username
    passwordKey: password
  tls:
    existingSecret: ""
    caKey: ca.crt
    clientCert: false
    certKey: tls.crt
    keyKey: tls.key
    insecureSkipVerify: false

metrics:
  service:
    enabled: true
    port: 8080
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

rbac:
  create: true

# ValidatingAdmissionPolicy (Kubernetes 1.30+) that lets the controller change only
# spec.job.state, spec.restartNonce and its own annotations. Cluster-scoped objects; on by
# default because they cost nothing and cap what a compromised controller could do.
admissionPolicy:
  enabled: true

# Standard pod knobs.
podSecurityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
resources: { requests: { cpu: 50m, memory: 256Mi }, limits: { memory: 512Mi } }
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
extraEnv: []
extraObjects: []
