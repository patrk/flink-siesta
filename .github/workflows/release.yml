# The compatibility grid, and on a tag the release behind it. Every operator version is one
# box in the run, with its Flink versions by scenario inside. Publishing needs all of them.
name: release
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 1" # the grid on main, weekly, to catch drift in the operator charts
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to publish after the grid passes. Empty runs the grid on main only.
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    with:
      flink: '["1.20", "2.0", "2.2", "2.3"]'
      ref: ${{ inputs.tag || github.ref }}

  operator-1-13:
    name: operator 1.13
    needs: prepare
    uses: ./.github/workflows/grid.yml
    with: { operator: "1.13.0", flink: '["1.20", "2.0", "2.2"]', ref: "${{ inputs.tag || github.ref }}" }

  operator-1-14:
    name: operator 1.14
    needs: prepare
    uses: ./.github/workflows/grid.yml
    with: { operator: "1.14.0", flink: '["1.20", "2.0", "2.2"]', ref: "${{ inputs.tag || github.ref }}" }

  operator-1-15:
    name: operator 1.15
    needs: prepare
    uses: ./.github/workflows/grid.yml
    with: { operator: "1.15.0", flink: '["1.20", "2.0", "2.2"]', ref: "${{ inputs.tag || github.ref }}" }

  operator-1-16: # flinkVersion v2_3 exists in the CRD from operator 1.16 on
    name: operator 1.16
    needs: prepare
    uses: ./.github/workflows/grid.yml
    with: { operator: "1.16.1", flink: '["1.20", "2.0", "2.2", "2.3"]', ref: "${{ inputs.tag || github.ref }}" }

  publish:
    needs: [operator-1-13, operator-1-14, operator-1-15, operator-1-16]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write # keyless signing with the workflow's OIDC identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: v
        # Through the environment, never pasted into the script: a tag name is not shell. Checked
        # here, because the steps below paste the outputs into theirs.
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$TAG"
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "chart=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: VERSION=${{ steps.v.outputs.tag }}
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: sign the image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"
      - name: package, push and sign the chart
        run: |
          helm package helm/flink-siesta --version "${{ steps.v.outputs.chart }}" --app-version "${{ steps.v.outputs.tag }}" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/flink-siesta-${{ steps.v.outputs.chart }}.tgz" "${{ env.CHART_REPO }}" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[a-f0-9]*' push.log | head -1)
          cosign sign --yes "${CHART_REPO#oci://}/flink-siesta@${digest}"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          files: dist/flink-siesta-${{ steps.v.outputs.chart }}.tgz
          body: |
            Image: `${{ env.IMAGE }}:${{ steps.v.outputs.tag }}` (linux/amd64, linux/arm64)
            Chart: `helm install siesta ${{ env.CHART_REPO }}/flink-siesta --version ${{ steps.v.outputs.chart }}`
            Both signed with cosign (keyless, this workflow's identity). Verify:
            `cosign verify ${{ env.IMAGE }}:${{ steps.v.outputs.tag }} --certificate-identity-regexp '^https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/' --certificate-oidc-issuer https://token.actions.githubusercontent.com`
