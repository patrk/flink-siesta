# Every scenario on one operator version across the Flink versions it supports. The release
# workflow calls this once per operator, so a run reads as one box per operator.
name: grid
on:
  workflow_call:
    inputs:
      operator: { description: Flink Kubernetes Operator version, type: string, required: true }
      flink: { description: JSON list of Flink versions, type: string, required: true }
      ref: { description: git ref to test, type: string, default: "" }

# Called workflows inherit the caller's permissions, read-only in every caller here.
permissions:
  contents: read

jobs:
  e2e:
    name: flink ${{ matrix.flink }} ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flink: ${{ fromJSON(inputs.flink) }}
        scenario: [suspend-resume, job-graph, outage, admission-gc, restart-budget, sources-auto]
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ inputs.ref || github.ref }}" }
      - uses: ./.github/actions/e2e
        with: { operator: "${{ inputs.operator }}", flink: "${{ matrix.flink }}", scenario: "${{ matrix.scenario }}" }
