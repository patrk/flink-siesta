# What takes hours or answers "is it still fine": chaos, the soaks and the benchmark. Nothing
# here gates a release. The compatibility grid lives in release.yml.
name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml

  chaos:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with: { target: e2e-chaos }

  soak-kind:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with: { target: e2e-soak }

  soak-simulated:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make envtest soak
        env: { SOAK_DEPLOYMENTS: "100", SOAK_TICKS: "3000", SOAK_TIMEOUT: "120m" }

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make envtest
      - run: make bench | tee bench.txt
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.run_id }}
          path: bench.txt
          retention-days: 90
