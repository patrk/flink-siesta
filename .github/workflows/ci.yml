name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13.2 }
      - run: make test
      - run: make envtest
      - run: helm lint helm/flink-siesta
      - run: |
          helm template t helm/flink-siesta --set kafka.bootstrapServers=b:9092 --set kafka.securityProtocol=SASL_SSL \
            --set kafka.sasl.existingSecret=s --set kafka.tls.existingSecret=t --set metrics.serviceMonitor.enabled=true \
            | grep -q "kind: ServiceMonitor"
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make it
  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        scenario: [suspend-resume, job-graph, outage, admission-gc, restart-budget]
    name: e2e ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1.15.0
        with: { cluster_name: siesta, config: e2e/kind.yaml }
      - run: make kind-deps e2e
        env:
          E2E_SCENARIO: ${{ matrix.scenario }}
