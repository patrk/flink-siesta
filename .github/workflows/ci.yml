name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.13.2 }
      - run: make test
      - run: make envtest
      - run: helm lint helm/flink-siesta
      - run: |
          helm template t helm/flink-siesta --set kafka.bootstrapServers=b:9092 --set kafka.securityProtocol=SASL_SSL \
            --set kafka.sasl.existingSecret=s --set kafka.tls.existingSecret=t --set metrics.serviceMonitor.enabled=true \
            | grep -q "kind: ServiceMonitor"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - run: make it

  prepare:
    uses: ./.github/workflows/prepare.yml

  e2e:
    needs: [test, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [suspend-resume, job-graph, outage, admission-gc, restart-budget, sources-auto]
    name: e2e ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with: { scenario: "${{ matrix.scenario }}" }
